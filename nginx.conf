# 3000 is the port react-router-serve used when Habla had a server, so existing
# port mappings keep working.
server {
    listen 3000;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Every address below the root (/a/<naddr>, /p/<nprofile>, /e/<nevent>) is a
    # client route, so anything that isn't a file gets the app shell.
    location / {
        try_files $uri /index.html;
    }

    # The shell names the current asset hashes, so it must always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints everything under /assets, so a file never changes in
    # place. A missing one is a 404, not the shell: a tab still running the
    # previous deploy should fail its chunk load, not parse HTML as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
